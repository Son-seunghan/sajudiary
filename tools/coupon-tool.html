<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>선물 쿠폰 발급기 — 사주다이어리 (운영자 전용)</title>
<style>
  :root {
    --paper:#f7f0df; --paper2:#faf5e8; --paper-dk:#ebe1c4;
    --ink:#2c2520; --ink2:#4a3f33; --ink3:#6b5d4f; --ink4:#8a7d6b;
    --vermil:#b13a2c; --vermil2:#8a2418;
    --gold:#b8923c; --jade:#5a8a98;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--ink4); margin-bottom: 24px; }
  .card {
    background: var(--paper2);
    border: 1px solid var(--paper-dk);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--ink3); margin-bottom: 6px; font-weight: 600; }
  input[type=password], input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--paper-dk);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .remember { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--ink4); }
  .products { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pbtn {
    padding: 14px 8px;
    border: 2px solid var(--paper-dk);
    border-radius: 10px;
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--ink2);
  }
  .pbtn small { display: block; font-weight: 400; font-size: 11px; color: var(--ink4); margin-top: 2px; }
  .pbtn.active { border-color: var(--vermil); background: #fff8f6; color: var(--vermil2); }
  .pbtn.any { grid-column: 1 / -1; border-style: dashed; }
  .pbtn.any.active { border-color: var(--gold); background: #fffbef; color: var(--ink); }
  .tbtn {
    padding: 14px 8px;
    border: 2px solid var(--paper-dk);
    border-radius: 10px;
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--ink2);
  }
  .tbtn small { display: block; font-weight: 400; font-size: 11px; color: var(--ink4); margin-top: 2px; }
  .tbtn.active { border-color: var(--jade); background: #f4f9fa; color: var(--ink); }
  .hist-status { font-size: 11px; color: var(--jade); font-weight: 700; margin-left: 6px; }
  .gen-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(180deg, #d05848, var(--vermil));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 4px;
  }
  .gen-btn:disabled { opacity: 0.4; }
  .result { display: none; }
  .result.show { display: block; }
  .code-box {
    font-family: monospace;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    padding: 16px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    letter-spacing: 1px;
    word-break: break-all;
    margin-bottom: 10px;
  }
  textarea {
    width: 100%;
    height: 230px;
    padding: 12px;
    border: 1px solid var(--paper-dk);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    background: #fff;
    resize: none;
  }
  .copy-btn {
    width: 100%;
    padding: 13px;
    background: var(--jade);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
  }
  .copy-btn.dark { background: var(--ink); }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 10px 22px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .note { font-size: 11px; color: var(--ink4); line-height: 1.6; margin-top: 14px; }

  /* 새 코드 발급 플래시 */
  @keyframes codeflash {
    0% { background: var(--vermil); }
    100% { background: var(--ink); }
  }
  .code-box.flash { animation: codeflash 0.7s ease; }

  /* 발급 이력 */
  .hist-item {
    border: 1px solid var(--paper-dk);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fff;
  }
  .hist-code { font-family: monospace; font-size: 13px; font-weight: 700; word-break: break-all; }
  .hist-meta { font-size: 11px; color: var(--ink4); margin: 4px 0 6px; }
  .hist-row { display: flex; gap: 6px; }
  .hist-memo {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--paper-dk);
    border-radius: 6px;
    font-size: 12px;
  }
  .hist-btn {
    padding: 7px 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    background: var(--paper-dk);
    color: var(--ink2);
  }
  .hist-btn.copy { background: var(--jade); color: #fff; }
</style>
</head>
<body>

<h1>🎁 쿠폰 발급기</h1>
<p class="sub">운영자 전용 · 개인 선물(1회용) / 홍보용(선착순 N명) 서명 코드 발급 (사주다이어리)</p>

<div class="card">
  <label>시크릿 (운영자 암호)</label>
  <input type="password" id="secret" placeholder="시크릿 입력 (Vercel COUPON_SECRET과 동일)" autocomplete="off">
  <label class="remember"><input type="checkbox" id="rememberSecret"> 이 기기에 기억하기</label>
</div>

<div class="card">
  <label>발급 유형</label>
  <div class="products">
    <button class="tbtn active" data-type="gift">🎁 개인 선물<small>1명 · 1회용</small></button>
    <button class="tbtn" data-type="promo">📣 홍보용<small>코드 1개 · 선착순 N명</small></button>
  </div>
  <div id="promoFields" style="display:none; margin-top:14px;">
    <label>홍보자 태그 (코드에 포함됨 · 영문 소문자/숫자 2~16자)</label>
    <input type="text" id="promoTag" placeholder="예: insta01, blog7" autocomplete="off">
    <label style="margin-top:10px">사용 횟수 제한 (선착순 인원)</label>
    <input type="text" id="promoLimit" inputmode="numeric" placeholder="예: 20 (최대 999)" autocomplete="off">
  </div>
</div>

<div class="card">
  <label>선물할 상품</label>
  <div class="products">
    <button class="pbtn" data-key="light">입문용 Light<small>9,900원</small></button>
    <button class="pbtn" data-key="deep">전문가용 Deep<small>29,900원</small></button>
    <button class="pbtn" data-key="couple">궁합<small>14,900원</small></button>
    <button class="pbtn" data-key="adult">궁합 성인용<small>17,900원</small></button>
    <button class="pbtn any active" data-key="any">🎁 만능 이용권<small>원하는 상품 아무거나 1개</small></button>
  </div>
</div>

<button class="gen-btn" id="genBtn" onclick="generate()">쿠폰 발급하기</button>

<div class="card result" id="result">
  <label>발급된 코드</label>
  <div class="code-box" id="codeBox"></div>
  <button class="copy-btn dark" onclick="copyCode()">코드만 복사</button>
  <label style="margin-top:16px">카톡 전송용 메시지</label>
  <textarea id="msgBox" readonly></textarea>
  <button class="copy-btn" onclick="copyMsg()">메시지 전체 복사 → 카톡에 붙여넣기</button>
  <p class="note" id="resultNote"></p>
</div>

<div class="card" id="historyCard" style="display:none">
  <label>📜 발급 이력 (이 기기에 저장됨)</label>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast">복사되었습니다</div>

<script>
const PRODUCT_LABEL = {
  light: '입문용 (Light) 사주 분석',
  deep: '전문가용 (Deep) 사주 분석',
  couple: '궁합 분석',
  adult: '궁합 분석 (성인용)',
  any: '원하시는 분석 상품 1개 (자유 선택)'
};
let selectedKey = 'any';
let selectedType = 'gift';

document.querySelectorAll('.pbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedKey = btn.dataset.key;
  });
});

document.querySelectorAll('.tbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    document.getElementById('promoFields').style.display = selectedType === 'promo' ? 'block' : 'none';
    document.getElementById('genBtn').textContent = selectedType === 'promo' ? '홍보용 쿠폰 발급하기' : '쿠폰 발급하기';
  });
});

// 시크릿 기억하기
const secretInput = document.getElementById('secret');
const rememberChk = document.getElementById('rememberSecret');
const saved = localStorage.getItem('coupon_tool_secret');
if (saved) { secretInput.value = saved; rememberChk.checked = true; }

async function hmac8(secret, msg) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msg));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 8);
}

function randNonce() {
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  const arr = new Uint8Array(6);
  crypto.getRandomValues(arr);
  return [...arr].map(b => chars[b % chars.length]).join('');
}

async function generate() {
  const secret = secretInput.value.trim();
  if (!secret) { alert('시크릿을 입력해주세요.'); return; }
  if (rememberChk.checked) localStorage.setItem('coupon_tool_secret', secret);
  else localStorage.removeItem('coupon_tool_secret');

  let code, msg, note;

  if (selectedType === 'promo') {
    // ── 홍보용 다회 쿠폰: promo-<key>-<tag>-<limit>-<sig8> ──
    const tag = document.getElementById('promoTag').value.trim().toLowerCase();
    const limitStr = document.getElementById('promoLimit').value.trim();
    if (!/^[a-z0-9]{2,16}$/.test(tag)) {
      alert('홍보자 태그는 영문 소문자/숫자 2~16자로 입력해주세요. (예: insta01)');
      return;
    }
    const limit = parseInt(limitStr, 10);
    if (!(limit >= 1 && limit <= 999)) {
      alert('사용 횟수는 1~999 사이 숫자로 입력해주세요.');
      return;
    }
    const sig = await hmac8(secret, 'promo-' + selectedKey + '-' + tag + '-' + limit);
    code = 'promo-' + selectedKey + '-' + tag + '-' + limit + '-' + sig;
    addHistory({ code, key: selectedKey, type: 'promo', tag, limit, time: Date.now(), memo: '' });
    msg =
`📣 사주다이어리 홍보용 쿠폰 — ${tag}님 전용

${PRODUCT_LABEL[selectedKey]}을(를) 선착순 ${limit}명에게 드리는 코드예요.

[ 팔로워분들께 안내할 사용 방법 ]
1. https://sajudiary.com 접속 → 카카오 로그인
2. 원하는 상품 선택 → 결제 페이지로 이동
3. "쿠폰 코드가 있어요" 클릭 → 아래 코드 입력

${code}

· 선착순 ${limit}명 한정 · 1인 1회
· 소진되면 "쿠폰이 모두 소진되었습니다"로 안내돼요
· 분석 결과는 마이페이지에 영구 보관됩니다
· 문의: 카카오톡 채널 → http://pf.kakao.com/_FtxcxnX`;
    note = '· 이 코드 하나를 <b>' + limit + '명</b>이 쓸 수 있어요 (1인 1회 자동 제한)<br>' +
           '· 사용될 때마다 이메일 알림에 <b>[' + tag + '] n/' + limit + '</b> 진행률이 표시돼요<br>' +
           '· 아래 발급 이력의 <b>현황</b> 버튼으로 실시간 소진 현황을 볼 수 있어요';
  } else {
    // ── 개인 선물 쿠폰: gift-<key>-<nonce>-<sig8> ──
    const nonce = randNonce();
    const sig = await hmac8(secret, selectedKey + '-' + nonce);
    code = 'gift-' + selectedKey + '-' + nonce + '-' + sig;
    addHistory({ code, key: selectedKey, type: 'gift', time: Date.now(), memo: '' });
    msg =
`🎁 사주다이어리 선물 이용권

${PRODUCT_LABEL[selectedKey]}을(를) 선물로 드려요!

[ 사용 방법 ]
1. https://sajudiary.com 접속 → 카카오 로그인
2. 원하는 상품 선택 → 결제 페이지로 이동
3. "쿠폰 코드가 있어요" 클릭 → 아래 코드 입력

${code}

· 이 코드는 1회용이에요.
· 분석 결과는 마이페이지에 영구 보관됩니다.
· 궁금한 점은 카카오톡 채널로 문의해주세요
  → http://pf.kakao.com/_FtxcxnX

읽어보시고 솔직한 후기 한 줄 부탁드려요 🙏`;
    note = '· 이 코드는 <b>1회용</b>입니다 (사용한 기기에서 재사용 불가)<br>' +
           '· 같은 코드를 여러 명에게 보내지 마세요 — 한 명당 한 장씩 새로 발급';
  }

  const codeBox = document.getElementById('codeBox');
  codeBox.textContent = code;
  // 새 코드임을 시각적으로 표시 (플래시)
  codeBox.classList.remove('flash');
  void codeBox.offsetWidth;  // 애니메이션 재시작 트릭
  codeBox.classList.add('flash');
  document.getElementById('msgBox').value = msg;
  document.getElementById('resultNote').innerHTML = note;
  document.getElementById('result').classList.add('show');
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

// ─── 홍보 쿠폰 사용 현황 조회 (서버 API — sajudiary.com에서만 작동) ───
async function checkPromoStatus(code, btnEl) {
  try {
    if (btnEl) btnEl.textContent = '…';
    const resp = await fetch('/api/coupon-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, statusOnly: true })
    });
    const r = await resp.json();
    if (r && r.ok && r.promo) {
      alert('📣 [' + r.tag + '] 사용 현황: ' + r.used + ' / ' + r.limit + (r.used >= r.limit ? '\n(소진 완료)' : '\n(잔여 ' + (r.limit - r.used) + '명)'));
    } else {
      alert((r && r.error) || '조회에 실패했습니다.');
    }
  } catch (e) {
    alert('조회 실패 — 현황 조회는 sajudiary.com/tools/coupon-tool.html 에서 열었을 때만 작동해요.');
  } finally {
    if (btnEl) btnEl.textContent = '현황';
  }
}

// ─── 발급 이력 (localStorage — 이 기기에만 저장) ───
const HIST_KEY = 'coupon_tool_history';
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { return []; }
}
function saveHistory(list) {
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 50)));  // 최근 50건
}
function addHistory(entry) {
  const list = getHistory();
  list.unshift(entry);
  saveHistory(list);
  renderHistory();
}
function updateMemo(code, memo) {
  const list = getHistory();
  const item = list.find(e => e.code === code);
  if (item) { item.memo = memo; saveHistory(list); }
}
function deleteHistory(code) {
  saveHistory(getHistory().filter(e => e.code !== code));
  renderHistory();
}
function copyHistCode(code) {
  navigator.clipboard.writeText(code).then(showToast);
}
function renderHistory() {
  const list = getHistory();
  const card = document.getElementById('historyCard');
  const box = document.getElementById('historyList');
  if (!list.length) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const KEY_SHORT = { light: '입문', deep: '전문가', couple: '궁합', adult: '성인궁합', any: '만능' };
  box.innerHTML = list.map(e => {
    const d = new Date(e.time);
    const t = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const memoEsc = (e.memo || '').replace(/"/g, '&quot;');
    const isPromo = e.type === 'promo';
    const meta = (isPromo ? '📣 <b>' + (e.tag || '') + '</b> · 선착순 ' + (e.limit || '?') + '명 · ' : '') +
      (KEY_SHORT[e.key] || e.key) + ' · ' + t;
    const statusBtn = isPromo
      ? '<button class="hist-btn" style="background:var(--jade);color:#fff" onclick="checkPromoStatus(\'' + e.code + '\', this)">현황</button>'
      : '';
    return '<div class="hist-item">' +
      '<div class="hist-code">' + e.code + '</div>' +
      '<div class="hist-meta">' + meta + '</div>' +
      '<div class="hist-row">' +
        '<input class="hist-memo" placeholder="' + (isPromo ? '캠페인 메모 (어디에 홍보하는지)' : '누구에게 줬는지 메모') + '" value="' + memoEsc + '" onchange="updateMemo(\'' + e.code + '\', this.value)">' +
        statusBtn +
        '<button class="hist-btn copy" onclick="copyHistCode(\'' + e.code + '\')">복사</button>' +
        '<button class="hist-btn" onclick="deleteHistory(\'' + e.code + '\')">✕</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
renderHistory();

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}
function copyCode() {
  navigator.clipboard.writeText(document.getElementById('codeBox').textContent).then(showToast);
}
function copyMsg() {
  navigator.clipboard.writeText(document.getElementById('msgBox').value).then(showToast);
}
</script>
</body>
</html>
